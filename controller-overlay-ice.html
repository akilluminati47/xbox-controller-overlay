<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Controller Overlay - Kenney Xbox Series (Ice Blue)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon:   #9fe3ff;
    --neon-a: #a8d4bd;
    --neon-b: #dcafaf;
    --neon-x: #a9c4de;
    --neon-y: #ded2a4;
    --dark:   rgba(18,23,30, 0.93);
    --panel:  rgba(18,23,30, 0.82);
    --border: rgba(168,224,255, 0.28);
    --font:   'Share Tech Mono', monospace;
  }

  html, body {
    background: transparent;
    width: 480px;
    height: 360px;
    overflow: hidden;
    font-family: var(--font);
  }

  #overlay {
    width: 480px;
    height: 360px;
    background: transparent;
    border: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: none;   /* no outline around the transparent dead space */
  }

  #overlay::after {
    content: '';
    position: absolute; inset: 0; z-index: 30;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.055) 2px, rgba(0,0,0,0.055) 4px
    );
  }

  .top-strip {
    position: relative; z-index: 10;
    background: var(--dark);
    border-bottom: 1px solid rgba(168,224,255,0.13);
    height: 36px; flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 10px;
  }

  .main-area {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  .arch-svg {
    position: absolute;
    top: 0; left: 0;
    width: 480px; height: 324px;
    z-index: 1;
    pointer-events: none;
  }

  .ctrl {
    position: absolute;
    z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    background: var(--panel);
    padding: 8px 6px;
    border-radius: 6px;
    border: 1px solid rgba(168,224,255,0.08);
  }
  .ctrl-dpad { left: 6px;  top: 12px; }
  .ctrl-ls   { left: 6px;  bottom: 10px; }
  .ctrl-face { right: 6px; top: 12px; }
  .ctrl-rs   { right: 6px; bottom: 10px; }
  .ctrl-label {
    font-size: 7px; letter-spacing: 2px;
    color: rgba(168,224,255,0.28); text-transform: uppercase;
  }

  .trig-group { display:flex;align-items:center;gap:4px;flex-shrink:0; }
  /* LT/RT glyph is a state indicator: full glow at any press level (--on).
     The bar fill is the analog readout and scales with travel (--lvl). */
  .trig-label {
    display:flex;align-items:center;flex-shrink:0;color:var(--neon);
    opacity:calc(0.42 + var(--on,0) * 0.58);
    filter:drop-shadow(0 0 calc(var(--on,0) * 5px) var(--neon))
           drop-shadow(0 0 calc(var(--on,0) * 13px) var(--neon));
    transition:opacity 0.05s, filter 0.05s;
  }
  .trig-bar {
    width:52px;height:9px;
    background:rgba(168,224,255,0.05);
    border:1px solid rgba(168,224,255,0.18); overflow:hidden;
  }
  .trig-fill {
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--neon),rgba(168,224,255,0.5));
    /* --lvl is the live 0..1 trigger value, set by the poll loop on .trig-group,
       so the glow grows with travel instead of being on/off */
    box-shadow:
      0 0 calc(3px + var(--lvl,0) * 9px) var(--neon),
      0 0 calc(var(--lvl,0) * 20px) var(--neon);
    transition:width 0.04s linear;
  }
  .trig-pct { font-size:7px;color:rgba(168,224,255,0.28);min-width:20px; }
  .bump {
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:opacity 0.06s,filter 0.06s;
    color:var(--neon);opacity:0.45;
  }
  .bump.pressed { opacity:1;filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 13px var(--neon)); }
  .center-btns { flex:1;display:flex;align-items:center;justify-content:center;gap:8px; }
  .mini-btn {
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 0.06s,filter 0.06s;flex-shrink:0;
    color:var(--neon);opacity:0.42;
  }
  .mini-btn.pressed { opacity:1;filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 12px var(--neon)); }
  .guide-btn { width:30px;height:30px; }
  .strip-gap { width:6px;flex-shrink:0; }

  /* ---- Kenney official Xbox Series glyphs (CC0), inlined as a sprite ---- */
  .k { display:block; }

  /* D-pad: Kenney's real shape. Base sits dim; the per-direction highlight path
     from xbox_dpad_<dir>.svg lights on press. */
  .dpad { width:84px;height:84px;position:relative;color:var(--neon); }
  .dpad .k-base { position:absolute;top:0;left:0;opacity:0.26; }
  .dp { position:absolute;top:0;left:0;opacity:0;transition:opacity 0.06s;color:var(--neon); }
  .dp.pressed {
    opacity:1;
    filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 13px var(--neon));
  }

  .stick-zone {
    width:68px;height:68px;border-radius:50%;
    background:rgba(168,224,255,0.04);
    border:1px solid rgba(168,224,255,0.14);
    position:relative;overflow:hidden;
  }
  .stick-zone::before { content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:1px dashed rgba(168,224,255,0.13);top:50%;left:50%;transform:translate(-50%,-50%); }
  .stick-zone::after {
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(transparent 49%,rgba(168,224,255,0.06) 49%,rgba(168,224,255,0.06) 51%,transparent 51%),
      linear-gradient(90deg,transparent 49%,rgba(168,224,255,0.06) 49%,rgba(168,224,255,0.06) 51%,transparent 51%);
  }
  .stick-dot {
    position:absolute;width:17px;height:17px;border-radius:50%;
    background:var(--neon);top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:0 0 11px var(--neon),0 0 24px rgba(168,224,255,0.4);
    transition:top 0.04s linear,left 0.04s linear;z-index:2;
  }
  .stick-dot.clicked { background:#fff;box-shadow:0 0 13px #fff,0 0 29px var(--neon); }

  /* stick glyph label - only the click state glows */
  .stick-label {
    position:relative;width:26px;height:26px;
    color:var(--neon);opacity:0.5;transition:opacity 0.06s;
  }
  .stick-label .k { position:absolute;top:0;left:0;transition:opacity 0.06s; }
  .stick-label .s-press { opacity:0; }
  .stick-label.clicked { opacity:1; }
  .stick-label.clicked .s-idle  { opacity:0; }
  .stick-label.clicked .s-press {
    opacity:1;
    filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 13px var(--neon));
  }

  /* Face buttons: Kenney's official colours in the real controller diamond -
     Y north, X west, B east, A south - inside a square footprint that matches
     the d-pad. */
  .face-cluster { width:84px;height:84px;position:relative; }
  .face-btn {
    position:absolute;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    opacity:0.58;transition:opacity 0.06s,filter 0.06s;
  }
  .btn-y { left:25px; top:0; }
  .btn-x { left:0;       top:25px; }
  .btn-b { left:50px; top:25px; }
  .btn-a { left:25px; top:50px; }
  .face-btn.pressed { opacity:1; }
  .btn-a.pressed { filter:drop-shadow(0 0 5px #7DB700) drop-shadow(0 0 15px rgba(125,183,0,0.75)); }
  .btn-b.pressed { filter:drop-shadow(0 0 5px #EF4E29) drop-shadow(0 0 15px rgba(239,78,41,0.75)); }
  .btn-x.pressed { filter:drop-shadow(0 0 5px #009FEB) drop-shadow(0 0 15px rgba(0,159,235,0.75)); }
  .btn-y.pressed { filter:drop-shadow(0 0 5px #FEB504) drop-shadow(0 0 15px rgba(254,181,4,0.75)); }

  #no-ctrl {
    position:absolute;inset:0;z-index:25;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
    background:rgba(18,23,30,0.9);
    font-size:10px;color:rgba(168,224,255,0.3);
    letter-spacing:3px;text-transform:uppercase;
  }
  #no-ctrl .icon { font-size:26px;opacity:0.22;animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.12} 50%{opacity:0.35} }
</style>
</head>

  <div id="no-ctrl">
    <div class="icon">🎮</div>
    connect controller
  </div>

  <div class="top-strip">
    <div class="trig-group" id="lt-group">
      <div class="trig-label"><svg class="k" viewBox="0 0 64 64" width="26" height="26"><use href="#k-lt"/></svg></div>
      <div class="trig-bar" id="lt-bar"><div class="trig-fill" id="lt-fill"></div></div>
      <div class="trig-pct" id="lt-pct">0%</div>
    </div>
    <div class="strip-gap"></div>
    <div class="bump" id="lb"><svg class="k" viewBox="0 0 64 64" width="32" height="32"><use href="#k-lb"/></svg></div>
    <div class="center-btns">
      <div class="mini-btn" id="btn-share"><svg class="k" viewBox="0 0 64 64" width="26" height="26"><use href="#k-view"/></svg></div>
      <div class="mini-btn guide-btn" id="btn-guide"><svg class="k" viewBox="0 0 64 64" width="30" height="30"><use href="#k-guide"/></svg></div>
      <div class="mini-btn" id="btn-menu"><svg class="k" viewBox="0 0 64 64" width="26" height="26"><use href="#k-menu"/></svg></div>
    </div>
    <div class="bump" id="rb"><svg class="k" viewBox="0 0 64 64" width="32" height="32"><use href="#k-rb"/></svg></div>
    <div class="strip-gap"></div>
    <div class="trig-group" id="rt-group">
      <div class="trig-pct" id="rt-pct" style="text-align:right">0%</div>
      <div class="trig-bar" id="rt-bar"><div class="trig-fill" id="rt-fill"></div></div>
      <div class="trig-label"><svg class="k" viewBox="0 0 64 64" width="26" height="26"><use href="#k-rt"/></svg></div>
    </div>
  </div>

  <div class="main-area">

    <!--
      Smooth arch vignette, popsicle dome shape
      ───────────────────────────────────────────
      SVG space: 480 × 324

      Arch path:
        Straight sides from y=322 up to shoulder y=182.
        Then a near-perfect semicircle (cubic bezier, k≈0.5523)
        of radius 136 px, peak at (240, 46).

        Left quarter:  C 104,107  165,46  240,46
        Right quarter: C 315,46   376,107 376,182

        This gives a fully smooth, zero-kink dome with no point at top.
        The blur mask (stdDeviation=18) feathers the cutout edge into
        the surrounding shadow. A solid inner arch keeps the center
        100% transparent.
    -->
    <svg class="arch-svg" viewBox="0 0 480 324" xmlns="http://www.w3.org/2000/svg">
      <defs>

        <filter id="taper" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
        </filter>

        <mask id="arch-mask" maskUnits="userSpaceOnUse">
          <rect width="480" height="324" fill="white"/>

          <!-- Blurred dome → creates the soft shadow taper -->
          <path d="M104,322 L104,182
                   C104,107 165,46 240,46
                   C315,46 376,107 376,182
                   L376,322 Z"
                fill="black" filter="url(#taper)"/>

          <!-- Solid dome → pins center to fully transparent -->
          <path d="M104,322 L104,182
                   C104,107 165,46 240,46
                   C315,46 376,107 376,182
                   L376,322 Z"
                fill="black"/>
        </mask>

      </defs>

      <rect width="480" height="324"
            fill="rgb(18,23,30)" fill-opacity="0.96"
            mask="url(#arch-mask)"/>

    </svg>

    <div class="ctrl ctrl-dpad">
      <div class="dpad">
        <svg class="k k-base" viewBox="0 0 64 64" width="84" height="84"><use href="#k-dpad"/></svg>
        <div class="dp dp-u" id="dp-u"><svg class="k" viewBox="0 0 64 64" width="84" height="84"><use href="#k-dpad-up"/></svg></div>
        <div class="dp dp-d" id="dp-d"><svg class="k" viewBox="0 0 64 64" width="84" height="84"><use href="#k-dpad-down"/></svg></div>
        <div class="dp dp-l" id="dp-l"><svg class="k" viewBox="0 0 64 64" width="84" height="84"><use href="#k-dpad-left"/></svg></div>
        <div class="dp dp-r" id="dp-r"><svg class="k" viewBox="0 0 64 64" width="84" height="84"><use href="#k-dpad-right"/></svg></div>
      </div>
    </div>

    <div class="ctrl ctrl-ls">
      <div class="ctrl-label stick-label" id="ls-label"><svg class="k s-idle" viewBox="0 0 64 64" width="26" height="26"><use href="#k-stick-l"/></svg><svg class="k s-press" viewBox="0 0 64 64" width="26" height="26"><use href="#k-stick-l-press"/></svg></div>
      <div class="stick-zone" id="ls-zone">
        <div class="stick-dot" id="ls-dot"></div>
      </div>
    </div>

    <div class="ctrl ctrl-face">
      <div class="face-cluster">
        <div class="face-btn btn-y" id="btn-y"><svg class="k" viewBox="0 0 64 64" width="34" height="34"><use href="#k-face-y"/></svg></div>
        <div class="face-btn btn-x" id="btn-x"><svg class="k" viewBox="0 0 64 64" width="34" height="34"><use href="#k-face-x"/></svg></div>
        <div class="face-btn btn-b" id="btn-b"><svg class="k" viewBox="0 0 64 64" width="34" height="34"><use href="#k-face-b"/></svg></div>
        <div class="face-btn btn-a" id="btn-a"><svg class="k" viewBox="0 0 64 64" width="34" height="34"><use href="#k-face-a"/></svg></div>
      </div>
    </div>

    <div class="ctrl ctrl-rs">
      <div class="ctrl-label stick-label" id="rs-label"><svg class="k s-idle" viewBox="0 0 64 64" width="26" height="26"><use href="#k-stick-r"/></svg><svg class="k s-press" viewBox="0 0 64 64" width="26" height="26"><use href="#k-stick-r-press"/></svg></div>
      <div class="stick-zone" id="rs-zone">
        <div class="stick-dot" id="rs-dot"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const DEADZONE = 0.12;
  const $ = id => document.getElementById(id);

  const els = {
    noCtrl:   $('no-ctrl'),
    ltFill:   $('lt-fill'), ltPct: $('lt-pct'), ltGroup: $('lt-group'),
    rtFill:   $('rt-fill'), rtPct: $('rt-pct'), rtGroup: $('rt-group'),
    lb: $('lb'), rb: $('rb'),
    btnA: $('btn-a'), btnB: $('btn-b'), btnX: $('btn-x'), btnY: $('btn-y'),
    btnShare: $('btn-share'), btnGuide: $('btn-guide'), btnMenu: $('btn-menu'),
    dpU: $('dp-u'), dpD: $('dp-d'), dpL: $('dp-l'), dpR: $('dp-r'),
    lsDot: $('ls-dot'), rsDot: $('rs-dot'),
  };

  function dz(v) { return Math.abs(v) < DEADZONE ? 0 : (v - Math.sign(v)*DEADZONE)/(1-DEADZONE); }
  function press(el, on) { el.classList.toggle('pressed', !!on); }
  function stick(dot, rx, ry, clicked) {
    dot.style.left = (50 + dz(rx)*50) + '%';
    dot.style.top  = (50 + dz(ry)*50) + '%';
    dot.classList.toggle('clicked', !!clicked);
    var lbl = document.getElementById(dot.id.slice(0, 2) + '-label');
    if (lbl) lbl.classList.toggle('clicked', !!clicked);
  }

  function poll() {
    const pads = navigator.getGamepads();
    let gp = null;
    for (const g of pads) { if (g) { gp = g; break; } }

    if (!gp) { els.noCtrl.style.display = 'flex'; requestAnimationFrame(poll); return; }
    els.noCtrl.style.display = 'none';

    const b = gp.buttons, ax = gp.axes;

    const lt = b[6]?.value ?? 0, rt = b[7]?.value ?? 0;
    els.ltFill.style.width = (lt*100) + '%'; els.ltPct.textContent = Math.round(lt*100) + '%';
    els.rtFill.style.width = (rt*100) + '%'; els.rtPct.textContent = Math.round(rt*100) + '%';
    // --lvl is analog (drives the bar glow); --on is binary past a small deadzone,
    // so the LT/RT glyph reads fully lit the instant the trigger moves at all.
    els.ltGroup.style.setProperty('--lvl', lt.toFixed(3));
    els.rtGroup.style.setProperty('--lvl', rt.toFixed(3));
    els.ltGroup.style.setProperty('--on', lt > 0.03 ? 1 : 0);
    els.rtGroup.style.setProperty('--on', rt > 0.03 ? 1 : 0);

    press(els.lb, b[4]?.pressed); press(els.rb, b[5]?.pressed);
    press(els.btnA, b[0]?.pressed); press(els.btnB, b[1]?.pressed);
    press(els.btnX, b[2]?.pressed); press(els.btnY, b[3]?.pressed);
    press(els.btnShare, b[8]?.pressed || b[17]?.pressed);
    press(els.btnMenu,  b[9]?.pressed);
    press(els.btnGuide, b[16]?.pressed);
    press(els.dpU, b[12]?.pressed); press(els.dpD, b[13]?.pressed);
    press(els.dpL, b[14]?.pressed); press(els.dpR, b[15]?.pressed);

    stick(els.lsDot, ax[0]??0, ax[1]??0, b[10]?.pressed);
    stick(els.rsDot, ax[2]??0, ax[3]??0, b[11]?.pressed);

    requestAnimationFrame(poll);
  }

  window.addEventListener('gamepadconnected', poll);
  poll();
</script>
